      input:invalid { border-color: var(--bad); }

      /* ---- layout ---- */
      main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 56px; display: grid; gap: 20px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
      .banner { padding: 10px 14px; border: 1px solid var(--bad); color: var(--bad); border-radius: 4px; background: var(--panel); }
      .banner.info { border-color: var(--line); color: var(--ink); }

      .hero { padding: 18px 20px 14px; }
      .hero-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
      .hero-head h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
      .hero-head p { color: var(--muted); }

      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .chartbox { min-width: 0; }
      .readout { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
      .readout .title { color: var(--muted); }
      .vals { display: flex; gap: 20px; }
      .val { display: flex; flex-direction: column; align-items: flex-start; }
      .val .lab { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
      .val .lab::before { content: ""; width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
      .val.read { --c: var(--read); }
      .val.write { --c: var(--write); }
      .val b { font-weight: 600; font-size: 24px; line-height: 1.15; letter-spacing: -0.015em; white-space: nowrap; }
      .val b small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
      .row .val b { font-size: 19px; }
      canvas { display: block; width: 100%; height: 190px; touch-action: pan-y; }
      .row canvas { height: 140px; }

      /* ---- workload rows ---- */
      #list { display: grid; gap: 14px; }
      .row { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 8px 24px; padding: 16px 20px; }
      .meta { display: flex; flex-direction: column; gap: 12px; }
      .meta h3 { font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
      .status { display: flex; align-items: center; gap: 7px; color: var(--muted); }
      .status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
      .status.ok { --c: var(--ok); color: var(--ink); }
      .status.warn { --c: var(--warn); }
      .cfg { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; }
      .cfg dt { color: var(--muted); }
      .cfg dd { margin: 0; overflow-wrap: anywhere; }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; }
      .scale { display: flex; align-items: center; gap: 8px; }
      .scale label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
      .scale input { width: 72px; }
      .row .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-self: start; }
      .pods { grid-column: 1 / -1; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
      .pods summary { cursor: pointer; color: var(--muted); width: max-content; }
      .tablewrap { overflow-x: auto; margin-top: 8px; }
      table { border-collapse: collapse; width: 100%; min-width: 680px; }
      th, td { text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
      th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
      th { font-weight: 500; color: var(--muted); }

      .empty { padding: 36px 24px; text-align: center; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); }
      .empty p { margin-bottom: 14px; }

      /* ---- dialog ---- */
      dialog {
        width: min(640px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel); color: var(--ink);
      }
      dialog::backdrop { background: rgba(8, 14, 20, .55); }
      dialog form { padding: 22px 24px; display: grid; gap: 16px; }
      dialog h2 { font-size: 18px; font-weight: 650; }
      .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
      .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .field.wide { grid-column: 1 / -1; }
      .field > span { font-weight: 600; }
      .field small { color: var(--muted); }
      .check { flex-direction: row; gap: 8px; align-items: flex-start; }
      .check input { margin-top: 3px; }
      .check small { display: block; color: var(--muted); font-weight: 400; }
      .formerr { color: var(--bad); min-height: 1.4em; }
      .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; }

      @media (max-width: 980px) {
        .row { grid-template-columns: 1fr; }
        .actions { margin-top: 0; }
      }
      @media (max-width: 700px) {
        .pair, .row .charts, .fields { grid-template-columns: 1fr; }
        main { padding: 14px 12px 40px; }
        .top { padding: 10px 12px; }
      }
    </style>
    </head>
    <body>
    <header class="top">
      <h1>kube-iobench</h1>
      <span class="spacer"></span>
      <label>Chart window
        <select id="win">
          <option value="60">1 minute</option>
          <option value="300" selected>5 minutes</option>
          <option value="900">15 minutes</option>
        </select>
      </label>
      <span id="conn" class="conn" role="status">Connecting</span>
      <button id="newBtn" class="primary" type="button">New workload</button>
    </header>

    <main>
      <div id="banner" class="banner" hidden role="alert"></div>

      <section class="panel hero" aria-labelledby="h-total">
        <div class="hero-head">
          <h2 id="h-total">All workloads</h2>
          <p id="totalSub">Waiting for data</p>
        </div>
        <div class="pair" id="totalCharts"></div>
      </section>

      <section id="list" aria-label="Workloads"></section>

      <div id="empty" class="empty" hidden>
        <p>No workloads yet. Create one to start generating IO on a storage class.</p>
        <button class="primary" type="button" id="emptyBtn">New workload</button>
      </div>
    </main>

    <dialog id="dlg" aria-labelledby="dlgTitle">
      <form id="form" novalidate>
        <h2 id="dlgTitle">New workload</h2>
        <div class="fields">
          <label class="field">
            <span>Name</span>
            <input type="text" name="name" required maxlength="40" pattern="[a-z]([\-a-z0-9]*[a-z0-9])?" autocomplete="off" spellcheck="false">
            <small>Lowercase letters, digits and dashes.</small>
          </label>
          <label class="field">
            <span>Storage class</span>
            <select name="storage_class" style="width:100%"><option value="">Cluster default</option></select>
            <small id="scHint">Each replica gets its own volume from this class.</small>
          </label>
          <label class="field">
            <span>Replicas</span>
            <input type="number" name="replicas" value="1" min="1" max="200" step="1" required>
            <small>Pods in the StatefulSet.</small>
          </label>
          <label class="field">
            <span>Volume size (GiB)</span>
            <input type="number" name="pvc_gib" min="0.001" step="any" placeholder="Automatic">
            <small>Per pod. Empty sizes it to fit the file.</small>
          </label>
          <label class="field">
            <span>File size (GiB)</span>
            <input type="number" name="size_gib" value="1" min="0.001" step="any" required>
            <small>Per pod. The volume is sized to fit.</small>
          </label>
          <label class="field">
            <span>Block size</span>
            <input type="text" name="block_size" value="4k" required autocomplete="off" spellcheck="false">
            <small>For example 4k, 64k or 1m.</small>
          </label>
          <label class="field">
            <span>Writes (%)</span>
            <input type="number" name="write_pct" value="100" min="0" max="100" step="any" required>
            <small>The rest are reads.</small>
          </label>
          <label class="field">
            <span>IOPS limit</span>
            <input type="number" name="iops" min="1" step="any" placeholder="No limit">
            <small>Per pod, reads and writes combined.</small>
          </label>
          <label class="field">
            <span>Throughput limit</span>
            <input type="text" name="throughput" placeholder="No limit" autocomplete="off" spellcheck="false">
            <small>Per pod, bytes per second, for example 50m.</small>
          </label>
          <label class="check wide field">
            <input type="checkbox" name="sequential">
            <span>Sequential access<small>Reads and writes each walk the file from the start. Otherwise offsets are random.</small></span>
          </label>
          <label class="check wide field">
            <input type="checkbox" name="direct">
            <span>Direct IO<small>Bypass the page cache so the numbers reflect the volume, not memory.</small></span>
          </label>
        </div>
        <p id="formErr" class="formerr" role="alert"></p>
        <div class="dlg-actions">
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit" class="primary" id="createBtn">Create workload</button>
        </div>
      </form>
    </dialog>

    <script>
    'use strict';

    const MiB = 1048576;
    const MAX_POINTS = 900;
    const nf = new Intl.NumberFormat();
    const $ = (s, r = document) => r.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let hist = [];            // [{t, total:[ri,rb,wi,wb,n], w:{name:[...]}}]
    let live = null;          // latest full event from the server
    let windowSec = 300;
    const rows = new Map();   // workload name -> row object
    let totalCharts = [];
    let totalRo = null;

    /* ------------------------------------------------------------------ */
    /* formatting                                                          */
    /* ------------------------------------------------------------------ */
    function fmtBps(bps) {
      const m = bps / MiB;
      if (m >= 1024) return [(m / 1024).toFixed(2), 'GiB/s'];
      if (m >= 1) return [m.toFixed(m >= 100 ? 0 : m >= 10 ? 1 : 2), 'MiB/s'];
      return [(bps / 1024).toFixed(0), 'KiB/s'];
    }
    const fmtIops = v => nf.format(Math.round(v));

    function niceMax(v) {
      if (!(v > 0)) return 1;
      const e = Math.pow(10, Math.floor(Math.log10(v)));
      const f = v / e;
      return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
    }
    function axisNum(v) {
      if (v === 0) return '0';
      if (v >= 1e6) return +(v / 1e6).toFixed(1) + 'M';
      if (v >= 1e3) return +(v / 1e3).toFixed(1) + 'k';
      if (v >= 10) return String(Math.round(v));
      return String(+v.toFixed(1));
    }

    /* ------------------------------------------------------------------ */
    /* drawing: only what is visible, only when something changed          */
    /* ------------------------------------------------------------------ */
    let palette = null;       // colours and font, read from CSS once (not on every draw)
    function getPalette() {
      if (palette) return palette;
      const css = getComputedStyle(document.documentElement);
      const v = n => css.getPropertyValue(n).trim();
      palette = {
        grid: v('--grid'), muted: v('--muted'), ink: v('--ink'), panel: v('--panel'), line: v('--line'),
        read: v('--read'), write: v('--write'), font: getComputedStyle(document.body).fontFamily,
      };
      return palette;
    }
    const colorScheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if (colorScheme && colorScheme.addEventListener) {
      colorScheme.addEventListener('change', () => { palette = null; markDirty(); });
    }

    const charts = new Set();       // every chart that exists
    let dirty = false;              // data changed: every chart needs a redraw
    let drawQueued = false;
    const nextFrame = cb => (window.requestAnimationFrame ? window.requestAnimationFrame(cb) : setTimeout(cb, 16));

    function markDirty() { dirty = true; scheduleDraw(); }
    function scheduleDraw() {
      if (drawQueued) return;
      drawQueued = true;
      nextFrame(() => { drawQueued = false; drawPending(); });
    }
    function drawPending() {
      if (document.hidden) return;                    // nothing to see; redone when the tab is shown
      if (dirty) { dirty = false; for (const c of charts) c.stale = true; }
      for (const c of charts) if (c.stale && c.visible) c.draw();
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) markDirty(); });

    // charts scrolled out of view are not drawn; they catch up when they come back
    const observer = window.IntersectionObserver
      ? new IntersectionObserver(list => {
          for (const e of list) {
            const c = e.target._chart;
            if (!c) continue;
            c.visible = e.isIntersecting;
            if (c.visible && c.stale) scheduleDraw();
          }
        }, { rootMargin: '200px' })
      : null;

    /* ------------------------------------------------------------------ */
    /* canvas chart: plain read/write lines, or bands stacked by replica   */
    /* ------------------------------------------------------------------ */
    class Chart {
      constructor(canvas, series, fmt) {
        this.canvas = canvas;
        // series(tStart) -> {times:[t], stacked, series:[{name, group, alpha, any, v}], tip?:(i)=>[lines]}
        this.series = series;
        this.fmt = fmt;          // value -> label for the plain-line tooltip
        this.hoverX = null;
        this.visible = true;
        this.stale = true;
        this.last = null;        // geometry and data of the last full draw, used by the tooltip
        this.snap = null;        // copy of the last full draw: hovering only adds an overlay to it
        this.snapValid = false;
        this.overlayQueued = false;
        canvas._chart = this;
        charts.add(this);
        if (observer) observer.observe(canvas);
        canvas.addEventListener('pointermove', e => {
          this.hoverX = e.clientX - canvas.getBoundingClientRect().left;
          this.queueOverlay();
        });
        canvas.addEventListener('pointerleave', () => { this.hoverX = null; this.queueOverlay(); });
      }

      destroy() {
        charts.delete(this);
        if (observer) observer.unobserve(this.canvas);
      }

      queueOverlay() {
        if (this.overlayQueued) return;
        this.overlayQueued = true;
        nextFrame(() => { this.overlayQueued = false; this.paintOverlay(); });
      }

      draw() {
        const c = this.canvas;
        const dpr = window.devicePixelRatio || 1;
        const w = c.clientWidth, h = c.clientHeight;
        if (!w || !h) return;
        const W = Math.round(w * dpr), H = Math.round(h * dpr);
        if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
        const g = c.getContext('2d');
        if (!g) return;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, h);

        const pal = getPalette();
        const tEnd = hist.length ? hist[hist.length - 1].t : Date.now() / 1000;
        const tStart = tEnd - windowSec;
        const d = this.series(tStart);
        const n = d.times.length;
        const nb = d.series.length;

        const L = 42, R = 8, T = 8, B = 20;
        const pw = w - L - R, ph = h - T - B;

        // cumulative tops for stacked charts, plain maximum otherwise
        let tops = null, max = 0;
        if (d.stacked && n) {
          tops = new Float64Array(nb * n);
          const acc = new Float64Array(n);
          for (let k = 0; k < nb; k++) {
            const v = d.series[k].v, off = k * n;
            for (let i = 0; i < n; i++) { acc[i] += v[i]; tops[off + i] = acc[i]; }
          }
          for (let i = 0; i < n; i++) if (acc[i] > max) max = acc[i];
        } else {
          for (const s of d.series) for (let i = 0; i < s.v.length; i++) if (s.v[i] > max) max = s.v[i];
        }
        const ymax = niceMax(max * 1.1);

        g.font = '11px ' + pal.font;
        g.lineWidth = 1;
        g.textAlign = 'right';
        g.textBaseline = 'middle';
        for (let i = 0; i <= 4; i++) {
          const y = Math.round(T + ph - ph * i / 4) + 0.5;
          g.strokeStyle = pal.grid;
          g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
          g.fillStyle = pal.muted;
          g.fillText(axisNum(ymax * i / 4), L - 6, y);
        }
        g.textBaseline = 'top';
        g.textAlign = 'left';
        g.fillStyle = pal.muted;
        g.fillText(windowSec >= 120 ? (windowSec / 60) + ' min ago' : windowSec + ' s ago', L, h - B + 5);
        g.textAlign = 'right';
        g.fillText('now', w - R, h - B + 5);

        const X = t => L + (t - tStart) / windowSec * pw;
        const Y = v => T + ph - v / ymax * ph;

        if (n && d.stacked) {
          const xs = new Float64Array(n);
          for (let i = 0; i < n; i++) xs[i] = X(d.times[i]);
          // Bands are painted one by one, bottom to top, exactly as before.
          for (let k = 0; k < nb; k++) {
            const s = d.series[k];
            if (!s.any) continue;
            const color = pal[s.group];
            const off = k * n, lo = (k - 1) * n;
            g.beginPath();
            for (let i = 0; i < n; i++) { const y = Y(tops[off + i]); i ? g.lineTo(xs[i], y) : g.moveTo(xs[i], y); }
            for (let i = n - 1; i >= 0; i--) g.lineTo(xs[i], Y(k ? tops[lo + i] : 0));
            g.closePath();
            g.globalAlpha = s.alpha;
            g.fillStyle = color;
            g.fill();
            g.globalAlpha = 1;
            g.beginPath();
            for (let i = 0; i < n; i++) { const y = Y(tops[off + i]); i ? g.lineTo(xs[i], y) : g.moveTo(xs[i], y); }
            g.strokeStyle = color;
            g.lineWidth = 1;
            g.lineJoin = 'round';
            g.stroke();
          }
        } else if (n) {
          for (const s of d.series) {
            const color = pal[s.group];
            g.beginPath();
            for (let i = 0; i < n; i++) { const x = X(d.times[i]), y = Y(s.v[i]); i ? g.lineTo(x, y) : g.moveTo(x, y); }
            g.strokeStyle = color;
            g.lineWidth = 1.75;
            g.lineJoin = 'round';
            g.stroke();
            g.lineTo(X(d.times[n - 1]), T + ph);
            g.lineTo(X(d.times[0]), T + ph);
            g.closePath();
            g.globalAlpha = 0.1;
            g.fillStyle = color;
            g.fill();
            g.globalAlpha = 1;
          }
        }

        this.last = { d, n, X, Y, tStart, L, T, pw, ph, w, dpr, pal };
        this.stale = false;
        this.snapValid = false;
        if (this.hoverX != null) this.paintOverlay();     // keep the tooltip while the data scrolls
      }

      // crosshair + tooltip, painted on top of a saved copy of the plain chart
      paintOverlay() {
        const st = this.last;
        if (!st) return;
        const c = this.canvas;
        const g = c.getContext('2d');
        if (!g) return;
        if (!this.snapValid) {
          if (this.hoverX == null) return;               // plain chart is already on screen
          if (!this.snap) this.snap = document.createElement('canvas');
          if (this.snap.width !== c.width || this.snap.height !== c.height) { this.snap.width = c.width; this.snap.height = c.height; }
          const sg = this.snap.getContext('2d');
          sg.clearRect(0, 0, c.width, c.height);
          sg.drawImage(c, 0, 0);
          this.snapValid = true;
        } else {
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.clearRect(0, 0, c.width, c.height);
          g.drawImage(this.snap, 0, 0);
        }
        g.setTransform(st.dpr, 0, 0, st.dpr, 0, 0);
        if (this.hoverX == null) return;

        const { d, n, X, Y, tStart, L, T, pw, ph, w, pal } = st;
        if (!n) return;
        const t = tStart + (this.hoverX - L) / pw * windowSec;
        let bi = 0, bd = Infinity;
        for (let i = 0; i < n; i++) {
          const dd = Math.abs(d.times[i] - t);
          if (dd < bd) { bd = dd; bi = i; }
        }
        const x = X(d.times[bi]);
        g.strokeStyle = pal.muted;
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(Math.round(x) + 0.5, T); g.lineTo(Math.round(x) + 0.5, T + ph); g.stroke();
        const lines = [new Date(d.times[bi] * 1000).toLocaleTimeString()];
        if (d.tip) {
          lines.push(...d.tip(bi));
        } else {
          for (const s of d.series) {
            g.beginPath(); g.arc(x, Y(s.v[bi]), 3.5, 0, 6.2832);
            g.fillStyle = pal[s.group]; g.fill();
            lines.push(s.name + '  ' + this.fmt(s.v[bi]));
          }
        }
        g.font = '12px ' + pal.font;
        const tw = Math.max(...lines.map(l => g.measureText(l).width)) + 16;
        const th = lines.length * 16 + 8;
        let bx = x > w / 2 ? x - tw - 10 : x + 10;
        bx = Math.max(2, Math.min(bx, w - tw - 2));
        g.fillStyle = pal.panel;
        g.strokeStyle = pal.line;
        g.beginPath(); g.rect(bx, T + 2, tw, th); g.fill(); g.stroke();
        g.fillStyle = pal.ink;
        g.textAlign = 'left';
        g.textBaseline = 'top';
        lines.forEach((l, i) => g.fillText(l, bx + 8, T + 6 + i * 16));
      }
    }

    const KIND = {
      bps:  { ri: 1, wi: 3, div: MiB, unit: 'MiB/s', num: v => v.toFixed(1) },
      iops: { ri: 0, wi: 2, div: 1,   unit: 'IOPS',  num: v => fmtIops(v) },
    };

    // history is sorted by time: first entry that is not older than t
    function firstIndexAtOrAfter(t) {
      let lo = 0, hi = hist.length;
      while (lo < hi) { const m = (lo + hi) >> 1; if (hist[m].t < t) lo = m + 1; else hi = m; }
      return lo;
    }

    // plain read/write lines; sel === null -> cluster total, otherwise a workload name
    function makeSeries(sel, kind) {
      const { ri, wi, div } = KIND[kind];
      return tStart => {
        const times = [], r = [], w = [];
        for (let i = firstIndexAtOrAfter(tStart); i < hist.length; i++) {
          const k = hist[i];
          const a = sel === null ? k.total : k.w[sel];
          if (!a) continue;
          times.push(k.t);
          r.push(a[ri] / div);
          w.push(a[wi] / div);
        }
        return { times, stacked: false,
                 series: [{ name: 'Read', group: 'read', v: r }, { name: 'Write', group: 'write', v: w }] };
      };
    }

    const podOrdinal = s => { const m = /(\d+)$/.exec(s); return m ? parseInt(m[1], 10) : 0; };

    // pod names seen per workload, with the time of the newest entry they appear in
    const podSeen = new Map();
    function noteEntry(e) {
      if (!e.p) return;
      for (const name in e.p) {
        let m = podSeen.get(name);
        if (!m) podSeen.set(name, m = new Map());
        for (const pn in e.p[name]) m.set(pn, e.t);
      }
    }
    function rebuildPodSeen() {
      podSeen.clear();
      for (const e of hist) noteEntry(e);
    }

    // one band per replica: all reads at the bottom, all writes stacked on top
    function makeStackedSeries(name, kind) {
      const { ri, wi, div, unit, num } = KIND[kind];
      return tStart => {
        const ticks = [];
        for (let i = firstIndexAtOrAfter(tStart); i < hist.length; i++) if (hist[i].w[name]) ticks.push(hist[i]);
        const pods = [];
        const seen = podSeen.get(name);
        if (seen) for (const [pn, last] of seen) if (last >= tStart) pods.push(pn);
        pods.sort((a, b) => podOrdinal(a) - podOrdinal(b));

        const n = ticks.length, P = pods.length;
        const reads = new Array(P), writes = new Array(P);
        const anyR = new Uint8Array(P), anyW = new Uint8Array(P);
        for (let j = 0; j < P; j++) { reads[j] = new Float64Array(n); writes[j] = new Float64Array(n); }
        const times = new Array(n);
        for (let i = 0; i < n; i++) {
          times[i] = ticks[i].t;
          const pm = ticks[i].p && ticks[i].p[name];
          if (!pm) continue;
          for (let j = 0; j < P; j++) {
            const a = pm[pods[j]];
            if (!a) continue;
            const r = a[ri] / div, w = a[wi] / div;
            reads[j][i] = r; writes[j][i] = w;
            if (r > 0) anyR[j] = 1;
            if (w > 0) anyW[j] = 1;
          }
        }
        const series = [];
        for (let j = 0; j < P; j++) series.push({ name: 'Read ' + pods[j], group: 'read', alpha: j % 2 ? 0.28 : 0.55, any: anyR[j] === 1, v: reads[j] });
        for (let j = 0; j < P; j++) series.push({ name: 'Write ' + pods[j], group: 'write', alpha: j % 2 ? 0.28 : 0.55, any: anyW[j] === 1, v: writes[j] });
        return {
          times, stacked: true, series,
          tip: i => {
            let R = 0, W = 0;
            for (let j = 0; j < P; j++) { R += reads[j][i]; W += writes[j][i]; }
            const out = ['Read  ' + num(R) + ' ' + unit, 'Write  ' + num(W) + ' ' + unit];
            if (P <= 8) {
              out.push('Per replica, read / write:');
              pods.forEach((pn, j) => out.push('#' + podOrdinal(pn) + '  ' + num(reads[j][i]) + ' / ' + num(writes[j][i])));
            } else {
              out.push(nf.format(P) + ' replicas');
            }
            return out;
          },
        };
      };
    }

    const fmtTip = {
      bps: v => v.toFixed(2) + ' MiB/s',
      iops: v => fmtIops(v) + ' IOPS',
    };

    // history helpers: a deleted workload must leave no trace, totals follow
    const sumAll = w => {
      const t = [0, 0, 0, 0, 0];
      for (const a of Object.values(w)) for (let i = 0; i < 5; i++) t[i] += a[i];
      return t;
    };
    function purgeWorkload(name) {
      for (const k of hist) {
        if (!k.w[name]) continue;
        delete k.w[name];
        if (k.p) delete k.p[name];
        k.total = sumAll(k.w);
      }
      podSeen.delete(name);
      markDirty();
    }

    // DOM writes only when the value really changed (a write invalidates layout even if it is the same)
    function setText(el, v) { if (el._t !== v) { el._t = v; el.textContent = v; } }
    function setHTML(el, v) { if (el._h !== v) { el._h = v; el.innerHTML = v; } }
    function setClass(el, v) { if (el._c !== v) { el._c = v; el.className = v; } }

    function chartBoxHTML(title, kind) {
      return `<figure class="chartbox" style="margin:0" data-kind="${kind}">
        <div class="readout">
          <span class="title">${title}</span>
          <span class="vals">
            <span class="val read"><span class="lab">Read</span><b data-v="r">0</b></span>
            <span class="val write"><span class="lab">Write</span><b data-v="w">0</b></span>
          </span>
        </div>
        <canvas aria-label="${title} over time"></canvas>
      </figure>`;
    }

    function readoutEls(scope) {
      const pick = kind => {
        const box = $(`[data-kind="${kind}"]`, scope);
        return { r: $('[data-v="r"]', box), w: $('[data-v="w"]', box) };
      };
      return { bps: pick('bps'), iops: pick('iops') };
    }

    function setReadout(ro, kind, a) {
      const e = ro[kind];
      if (kind === 'bps') {
        const [rn, ru] = fmtBps(a[1]);
        const [wn, wu] = fmtBps(a[3]);
        setHTML(e.r, `${rn}<small>${ru}</small>`);
        setHTML(e.w, `${wn}<small>${wu}</small>`);
      } else {
        setHTML(e.r, `${fmtIops(a[0])}<small>IOPS</small>`);
        setHTML(e.w, `${fmtIops(a[2])}<small>IOPS</small>`);
      }
    }

    function makeCharts(scope, sel, isStacked) {
      const out = [];
      for (const kind of ['bps', 'iops']) {
        const canvas = $(`[data-kind="${kind}"] canvas`, scope);
        const plain = makeSeries(sel, kind);
        const stacked = sel === null ? null : makeStackedSeries(sel, kind);
        const pick = ts => (stacked && isStacked && isStacked()) ? stacked(ts) : plain(ts);
        out.push(new Chart(canvas, pick, fmtTip[kind]));
      }
      return out;
    }

    function setTitles(row) {
      $('[data-kind="bps"] .title', row.el).textContent = row.stacked ? 'Throughput, MiB/s by replica' : 'Throughput, MiB/s';
      $('[data-kind="iops"] .title', row.el).textContent = row.stacked ? 'IOPS by replica' : 'IOPS';
    }

    /* ------------------------------------------------------------------ */
    /* rendering                                                           */
    /* ------------------------------------------------------------------ */
    const plural = (n, one, many) => `${nf.format(n)} ${n === 1 ? one : many}`;

    function initTotal() {
      const box = $('#totalCharts');
      box.innerHTML = chartBoxHTML('Throughput, MiB/s', 'bps') + chartBoxHTML('IOPS', 'iops');
      totalCharts = makeCharts(box, null);
      totalRo = readoutEls(box);
    }

    function renderTotal() {
      const t = live.total;
      setReadout(totalRo, 'bps', t);
      setReadout(totalRo, 'iops', t);
      const n = live.workloads.length;
      setText($('#totalSub'), n
        ? `${plural(n, 'workload', 'workloads')}, ${plural(t[4], 'pod', 'pods')} generating IO`
        : 'No workloads running');
    }

    function cfgHTML(c) {
      if (!c || !c.name) return placementRow;
      const lim = [];
      if (c.iops) lim.push(nf.format(c.iops) + ' IOPS');
      if (c.throughput) lim.push(c.throughput + ' per second');
      const items = [
        ['Storage class', c.storage_class || 'cluster default'],
        ...(c.pvc_gib ? [['Volume size', c.pvc_gib + ' GiB per pod']] : []),
        ['File size', c.size_gib + ' GiB per pod'],
        ['Block size', c.block_size],
        ['Access', (c.sequential ? 'sequential' : 'random') + (c.direct ? ', direct IO' : '')],
        ['Writes', c.write_pct + '%'],
        ['Limits', lim.length ? lim.join(', ') + ' per pod' : 'none'],
      ];
      return items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + placementRow;
    }
    const placementRow = '<dt>Placement</dt><dd data-nodes></dd>';

    function createRow(w) {
      const el = document.createElement('article');
      el.className = 'panel row';
      el.innerHTML = `
        <div class="meta">
          <div>
            <h3>${esc(w.name)}</h3>
            <p class="status" data-status></p>
          </div>
          <dl class="cfg" data-cfg></dl>
          <div class="actions">
            <form class="scale" data-scale>
              <label>Replicas <input type="number" min="0" max="200" step="1" data-rep required></label>
              <button type="submit">Apply</button>
            </form>
            <button type="button" class="danger" data-del>Delete</button>
          </div>
        </div>
        <div class="charts">${chartBoxHTML('Throughput, MiB/s', 'bps')}${chartBoxHTML('IOPS', 'iops')}</div>
        <details class="pods" data-pods>
          <summary>Pods</summary>
          <div class="tablewrap"><table>
            <thead><tr><th>Pod</th><th>Node</th><th>State</th><th>Read</th><th>Read IOPS</th><th>Write</th><th>Write IOPS</th></tr></thead>
            <tbody></tbody>
          </table></div>
        </details>`;
      const row = { el, name: w.name, uid: w.uid, stacked: w.replicas > 1, cfgKey: null, dirty: false, podsData: [] };
      row.charts = makeCharts(el, w.name, () => row.stacked);
      row.ro = readoutEls(el);
      row.statusEl = $('[data-status]', el);
      row.cfgEl = $('[data-cfg]', el);
      row.nodesEl = null;
      setTitles(row);
      row.rep = $('[data-rep]', el);
      row.details = $('[data-pods]', el);
      row.rep.addEventListener('input', () => { row.dirty = true; });
      row.details.addEventListener('toggle', () => { if (row.details.open) fillPods(row); });

      $('[data-scale]', el).addEventListener('submit', async e => {
        e.preventDefault();
        const n = parseInt(row.rep.value, 10);
        if (isNaN(n)) return;
        try {
          await api('PATCH', 'api/workloads/' + encodeURIComponent(w.name), { replicas: n });
          row.dirty = false;
          notify(`Scaled ${w.name} to ${plural(n, 'replica', 'replicas')}.`);
        } catch (err) { notify(err.message, true); }
      });
      $('[data-del]', el).addEventListener('click', async () => {
        if (!confirm(`Delete workload "${w.name}" and its volumes?`)) return;
        try {
          await api('DELETE', 'api/workloads/' + encodeURIComponent(w.name));
          notify(`Deleted ${w.name}.`);
        } catch (err) { notify(err.message, true); }
      });
      return row;
    }

    function fillPods(row) {
      const body = $('tbody', row.details);
      body.innerHTML = row.podsData.map(p => {
        const [rb, ru] = fmtBps(p.v[1]);
        const [wb, wu] = fmtBps(p.v[3]);
        return `<tr><td>${esc(p.name)}</td><td>${esc(p.node || 'not scheduled')}</td><td>${esc(p.state)}</td>
          <td>${rb} ${ru}</td><td>${fmtIops(p.v[0])}</td><td>${wb} ${wu}</td><td>${fmtIops(p.v[2])}</td></tr>`;
      }).join('');
    }

    function updateRow(row, w, pods, agg) {
      const counts = {};
      for (const p of pods) counts[p.state] = (counts[p.state] || 0) + 1;
      const running = counts.running || 0;
      let text, cls = '';
      if (w.replicas === 0) {
        text = 'Stopped, 0 replicas';
      } else {
        const parts = [`${running} of ${w.replicas} generating IO`];
        for (const k of Object.keys(counts)) if (k !== 'running') parts.push(`${counts[k]} ${k}`);
        text = parts.join(', ');
        cls = running === w.replicas ? 'ok' : 'warn';
      }
      setText(row.statusEl, text);
      setClass(row.statusEl, 'status ' + cls);

      const stacked = w.replicas > 1;
      if (stacked !== row.stacked) { row.stacked = stacked; setTitles(row); markDirty(); }

      const key = JSON.stringify(w.config);
      if (key !== row.cfgKey) {
        row.cfgEl.innerHTML = cfgHTML(w.config);
        row.cfgKey = key;
        row.nodesEl = $('[data-nodes]', row.el);
        if (row.nodesEl) row.nodesEl._t = undefined;
      }

      const nodes = new Set(pods.map(p => p.node).filter(Boolean));
      const placed = pods.filter(p => p.node).length;
      if (row.nodesEl) {
        setText(row.nodesEl, !placed ? 'not scheduled yet'
          : (w.replicas > 1 && placed > 1 && nodes.size === 1) ? `all ${placed} pods on one node`
          : plural(nodes.size, 'node', 'nodes'));
      }

      if (!row.dirty && document.activeElement !== row.rep) row.rep.value = w.replicas;
      setReadout(row.ro, 'bps', agg);
      setReadout(row.ro, 'iops', agg);
      row.podsData = pods;
      if (row.details.open) fillPods(row);
    }

    function syncRows() {
      const list = live.workloads;
      const host = $('#list');
      list.forEach((w, i) => {
        let row = rows.get(w.name);
        if (!row) { row = createRow(w); rows.set(w.name, row); }
        const at = host.children[i];
        if (at !== row.el) host.insertBefore(row.el, at || null);
        updateRow(row, w, live.pods[w.name] || [], live.w[w.name] || [0, 0, 0, 0, 0]);
      });
      $('#empty').hidden = list.length > 0;
    }

    // A workload that was deleted, or deleted and created again under the same name, loses all
    // its history. This runs before new data is added, so nothing of the new one is lost.
    function dropGone(list) {
      const byName = new Map(list.map(w => [w.name, w]));
      for (const [name, row] of rows) {
        const w = byName.get(name);
        if (!w || w.uid !== row.uid) {
          row.charts.forEach(c => c.destroy());
          row.el.remove();
          rows.delete(name);
          purgeWorkload(name);
        }
      }
    }

    function render() {
      if (!live) return;
      const banner = $('#banner');
      if (live.error) { banner.textContent = live.error; banner.className = 'banner'; banner.hidden = false; }
      else if (banner.dataset.sticky !== '1') banner.hidden = true;
      renderTotal();
      syncRows();
    }

    let noticeTimer = null;
    function notify(text, isError) {
      const b = $('#banner');
      b.textContent = text;
      b.className = 'banner' + (isError ? '' : ' info');
      b.hidden = false;
      b.dataset.sticky = '1';
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { b.dataset.sticky = '0'; if (!live || !live.error) b.hidden = true; }, 6000);
    }

    /* ------------------------------------------------------------------ */
    /* server communication                                                */
    /* ------------------------------------------------------------------ */
    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      let data = {};
      try { data = await res.json(); } catch (e) { /* empty body */ }
      if (!res.ok) throw new Error(data.error || res.statusText || 'Request failed');
      return data;
    }

    // Every entry is one whole second [t-1, t) that the server has finished.
    function addEntry(e) {
      const last = hist.length ? hist[hist.length - 1] : null;
      if (last && e.t < last.t) return;                       // older than what we already have
      if (last && e.t === last.t) hist[hist.length - 1] = e;  // same second again: replace
      else hist.push(e);
      if (hist.length > MAX_POINTS) hist.splice(0, hist.length - MAX_POINTS);
      noteEntry(e);
      markDirty();
    }

    function connect() {
      const conn = $('#conn');
      const es = new EventSource('api/stream');
      es.onopen = () => { conn.textContent = 'Live'; conn.className = 'conn live'; };
      es.onerror = () => { conn.textContent = 'Reconnecting'; conn.className = 'conn down'; };
      es.addEventListener('snapshot', e => { hist = JSON.parse(e.data).history || []; rebuildPodSeen(); markDirty(); });
      es.onmessage = e => {
        const ev = JSON.parse(e.data);
        if (!ev.t) return;
        dropGone(ev.workloads);
        live = ev;
        for (const entry of ev.entries || []) addEntry(entry);
        render();
      };
    }

    /* ------------------------------------------------------------------ */
    /* new workload dialog                                                 */
    /* ------------------------------------------------------------------ */
    const dlg = $('#dlg'), form = $('#form');

    function suggestName() {
      let i = 1;
      while (rows.has('bench-' + i)) i++;
      return 'bench-' + i;
    }

    async function loadClasses() {
      const sel = form.elements.storage_class;
      const hint = $('#scHint');
      try {
        const list = await api('GET', 'api/storageclasses');
        const keep = sel.value;
        sel.innerHTML = '<option value="">Cluster default</option>' + list.map(c =>
          `<option value="${esc(c.name)}">${esc(c.name)}${c.default ? ' (default)' : ''}</option>`).join('');
        sel.value = keep;
        const hasDefault = list.some(c => c.default);
        if (!list.length) hint.textContent = 'No storage classes found in this cluster.';
        else if (!hasDefault) {
          hint.textContent = 'This cluster has no default class, so pick one.';
          if (!keep) sel.value = list[0].name;
        } else hint.textContent = 'Each replica gets its own volume from this class.';
      } catch (err) {
        hint.textContent = 'Could not list storage classes: ' + err.message;
      }
    }

    // shows what "automatic" would pick for the current file size (same rule as the backend)
    function updateAutoVolume() {
      const size = parseFloat(form.elements.size_gib.value);
      form.elements.pvc_gib.placeholder = size > 0
        ? 'Automatic, ' + Math.max(Math.ceil(size * 1.1), Math.ceil(size) + 1) + ' GiB'
        : 'Automatic';
    }
    form.elements.size_gib.addEventListener('input', updateAutoVolume);

    function openDialog() {
      updateAutoVolume();
      form.elements.name.value = suggestName();
      $('#formErr').textContent = '';
      loadClasses();
      dlg.showModal();
      form.elements.name.select();
    }

    $('#newBtn').addEventListener('click', openDialog);
    $('#emptyBtn').addEventListener('click', openDialog);
    $('#cancelBtn').addEventListener('click', () => dlg.close());

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#formErr');
      err.textContent = '';
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      const f = form.elements;
      const body = {
        name: f.name.value.trim(),
        storage_class: f.storage_class.value,
        replicas: parseInt(f.replicas.value, 10),
        size_gib: parseFloat(f.size_gib.value),
        block_size: f.block_size.value.trim(),
        write_pct: parseFloat(f.write_pct.value),
        pvc_gib: f.pvc_gib.value === '' ? null : parseFloat(f.pvc_gib.value),
        iops: f.iops.value === '' ? null : parseFloat(f.iops.value),
        throughput: f.throughput.value.trim() || null,
        sequential: f.sequential.checked,
        direct: f.direct.checked,
      };
      const btn = $('#createBtn');
      btn.disabled = true;
      try {
        await api('POST', 'api/workloads', body);
        dlg.close();
        notify(`Created ${body.name}. Pods start shortly.`);
      } catch (ex) {
        err.textContent = ex.message;
      } finally {
        btn.disabled = false;
      }
    });

    /* ------------------------------------------------------------------ */
    $('#win').addEventListener('change', e => { windowSec = parseInt(e.target.value, 10); markDirty(); });
    window.addEventListener('resize', markDirty);
    initTotal();
    connect();
    </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iobench-ui
  namespace: kube-iobench
  labels:
    app.kubernetes.io/name: iobench-ui
    app.kubernetes.io/part-of: kube-iobench
spec:
  replicas: 1
  strategy:
    type: Recreate        # one instance: metric history is held in memory
  selector:
    matchLabels:
      app.kubernetes.io/name: iobench-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iobench-ui
        app.kubernetes.io/part-of: kube-iobench
      annotations:
        kube-iobench/app-sha256: "6666d07058eca4e8"   # restarts the pod when the app code changes
    spec:
      serviceAccountName: iobench-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: python:3.12-slim
          command: ["python3", "-u", "/app/server.py"]
          env:
            - name: IOBENCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IOBENCH_IMAGE              # image used by the worker pods
              value: "python:3.12-slim"
            - name: IOBENCH_SCRIPT_CONFIGMAP
              value: iobench-script
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: iobench-app
---
apiVersion: v1
kind: Service
metadata:
  name: iobench-ui
  namespace: kube-iobench
  labels:
    app.kubernetes.io/part-of: kube-iobench
spec:
  selector:
    app.kubernetes.io/name: iobench-ui
  ports:
    - name: http
      port: 80
      targetPort: http
  type: NodePort
